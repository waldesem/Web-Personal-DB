[project]
name = "server-litestar"
version = "1.0.0"
description = "StaffSec"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "litestar[jwt,pydantic,standard]>=2.19.0",
    "piccolo[postgres]>=1.33.0",
    "python-dotenv>=1.2.1",
]

[tool.ruff]
select = ["ALL"]
ignore = ["ERA001", "DTZ005", "PLC0415", "PLR2004", "RUF003", "RUF001", "B009", "TC001", "TC002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S311"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
