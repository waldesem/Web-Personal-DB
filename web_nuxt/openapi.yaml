openapi: 3.0.0
info:
  title: StaffSec API.
  description: API документация для StaffSec.
  version: 1.0.0
servers:
  - url: http://{server}:{port}
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Используйте Bearer-токен в заголовке `Authorization`:  
        `Authorization: Bearer <token>`.  
paths:
  /route/api/json:
    post:
      summary: Получение анкеты из JSON
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '../schemas/AnketaJson.json'
      responses:
        "201":
          description: Анкета создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {
                    type: string
                  }
              examples: { "message": "success" }

        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {
                    type: string
                  }
            examples: { "message": "error" }