openapi: 3.0.0
info:
  title: StaffSec API.
  description: API документация для StaffSec.
  version: 1.0.0
servers:
  - url: http://{server}:{port}
    description: Production server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Используйте Bearer-токен в заголовке `Authorization`:  
        `Authorization: Bearer <token>`.  
        Токен получается через эндпоинт аутентификации.
  schemas:
    JwtToken:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID пользователя
        fullname:
          type: string
          description: Полное имя пользователя
        username:
          type: string
          description: Имя пользователя
        email:
          type: string
          description: Email пользователя
        role:
          type: string
          enum:
            - guest
            - user
            - admin
          description: Роль пользователя
        exp:
          type: integer
          format: int64
          description: Время истечения токена (timestamp)
        jti:
          type: string
          description: Уникальный идентификатор токена
      required:
        - id
        - fullname
        - username
        - email
        - role
        - exp
        - jti

paths:
  /route/anketa/self/{person_id}:
    get:
      summary: Переключение пользователя для редактирования анкеты
      security:
        - bearerAuth: []
      parameters:
        - name: person_id
          in: path
          required: true
          description: ID кандидата
          schema:
            type: integer
      responses:
        "201":
          description: Успешное переключение пользователя
          content:
            application/json:
              example: { "message": "success" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              example: { "message": "error" }

  /route/anketa/files/{person_id}:
    post:
      summary: Загрузка файлов на сервер
      security:
        - bearerAuth: []
      parameters:
        - name: person_id
          in: path
          required: true
          description: ID кандидата
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Успешная загрузка файлов
          content:
            application/json:
              example: { "message": "success" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              example: { "message": "error" }

  /route/anketa/json:
    post:
      summary: Создание или обновление анкеты из JSON
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '../schemas/AnketaJson.json'
      responses:
        "201":
          description: Data submitted successfully
        "400":
          description: Invalid JSON

  /route/items/persons/{person_id}:
    get:
      summary: Получение информации о кандидате
      security:
        - bearerAuth: []
      parameters:
        - name: person_id
          in: path
          required: true
          description: ID кандидата
          schema:
            type: integer
      responses:
        "200":
          description: Person details
          content:
            application/json:
              schema:
                type: object
                $ref: '../schemas/PersonOut.json'
    delete:
      summary: Удаление кандидата
      parameters:
        - name: person_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Удаление успешное
          content:
            application/json:
              example: { "message": "success" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              example: { "message": "error" }

  /route/items/persons:
    post:
      summary: Создание нового кандидата
      scurity:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '../schemas/PersonIn.json'
      responses:
        "201":
          description: Кандидата создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  person_id: {
                    type: integer
                  }
                  exists: {
                    type: boolean
                  }

  /route/items/{item}/{item_id}:
    get:
      summary: Получение списка данных об объекте по ID
      security:
        - bearerAuth: []
      parameters:
        - name: item
          in: path
          required: true
          description: Тип объекта
          schema:
            type: string
            $ref: '../schemas/Items.json'
        - name: item_id
          in: path
          required: true
          description: ID объекта
      responses:
        "200":
          description: 
          content:
            application/json:
              schema:
                type: array
                oneOf:
                - $ref: '../schemas/Address.json'
                - $ref: '../schemas/Contact.json'
                - $ref: '../schemas/Education.json'
                - $ref: '../schemas/Staff.json'
                - $ref: '../schemas/Workplace.json'
                - $ref: '../schemas/Document.json'
                - $ref: '../schemas/Affilation.json'
                - $ref: '../schemas/Check.json'
                - $ref: '../schemas/Poligraf.json'
                - $ref: '../schemas/Inquiry.json'
                - $ref: '../schemas/Investigation.json'
                - $ref: '../schemas/Previous.json'

    post:
      summary: Загрузка данных об объекте
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            $ref: '../schemas/Items.json'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object

      responses:
        "201":
          description: Данные загружены
          content:
            application/json:
              example: { "message": "success" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              example: { "message": "error" }
    delete:
      summary: Удаление объекта
      parameters:
        - name: item
          in: path
          required: true
          schema:
            type: string
            $ref: '../schemas/Items.json'
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Удаление успешное
          content:
            application/json:
              example: { "message": "success" }
        "500":
          description: Внутренняя ошибка
          content:
            application/json:
              example: { "message": "error" }

  /route/auth/{action}:
    post:
      summary: Вход в систему и получение токена или обновление пароля
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: path
          required: true
          description: Действие входа в систему
          schema:
            type: string
            enum:
              - login
              - update
      requestBody:
        content:
          application/json:
            example: { "username": "user", "password": "pass" }
      responses:
        "201":
          description: Токен получен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {
                    type: string
                  }
                  token: {
                    $ref: '../schemas/Token.json'
                  }
        "500":
          description: Unauthorized
          content:
            application/json:
              example: {
                "message": "error"
              }

  /route/auth/logout:
    get:
      summary: Выход из системы
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Выход из системы успешный
          content:
            application/json:
              example: {
                "message": "success"
              }

    options:
      summary: Options for logout endpoint
      responses:
        "200":
          description: Available methods

  /route/index:
    get:
      summary: Получение главной страницы со списком кандидатов
      responses:
        "200":
          description: Главная страница
          content:
            application/json:
              schema:
                type: object
                $ref: '../schemas/Candidates.json'

  /route/users:
    get:
      summary: Получение списка пользователей
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  $ref: '../schemas/User.json'

  /route/user/{user_id}:
    post:
      summary: Изменение информации о пользователе
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item: {
                  type: string
                }
      responses:
        "201":
          description: Пользователь изменен
          content:
            application/json:
              schema:
                type: object
                example: { "message": "success" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                type: object
                example: { "message": "error" }

  /route/user:
    post:
      summary: Создание нового пользователя
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullname: {
                  type: string
                }
                username: {
                  type: string
                }
                email: {
                  type: string
                }
              required:
                - fullname
                - username
                - email
                
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                example: { "message": "success" }
        "500":
          description: Ошибка сервера
          content:
            application/json:
              schema:
                type: object
                example: { "message": "error" }
