version: '3.8'

services:
  # Flask-приложение
  app:
    build:
      context: ./app
    container_name: flask-app
    restart: unless-stopped
    environment:
      - FLASK_APP=server_flask.app
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/myapp_db
    depends_on:
      - db
    volumes:
      - static-data:/app/static  # если есть статика

  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # опционально
    ports:
      - "5432:5432"  # Только для доступа с хоста (в dev)

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static-data:/app/static
    restart: unless-stopped

volumes:
  postgres_data:
  static-data:
